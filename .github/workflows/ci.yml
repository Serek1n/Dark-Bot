name: CI
on: [push, pull_request]
# the job only reads the repository: its token can change nothing
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # known vulnerabilities in what the bot runs with (does not stop the build: an advisory can appear overnight)
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
