# nginx for the panel at https://darkbot.space (port 443).
# Install: cp /opt/Dark-Bot/deploy/nginx/darkbot-space.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# The certificate: certbot certonly --webroot -w /var/www/letsencrypt -d darkbot.space --deploy-hook "systemctl reload nginx"

# port 80: the Let's Encrypt check (renewal is automatic), everything else goes to https
server {
    listen 80;
    listen [::]:80;
    server_name darkbot.space;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://darkbot.space$request_uri; }
}

# port 8843: the old address of the panel — links and bookmarks lead to the new one
server {
    listen 8843 ssl;
    server_name darkbot.space;
    ssl_certificate     /etc/letsencrypt/live/darkbot.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkbot.space/privkey.pem;
    return 301 https://darkbot.space$request_uri;
}

# port 443: the panel itself
server {
    listen 443 ssl http2;     # works on every nginx version (newer ones only warn)
    listen [::]:443 ssl http2;
    server_name darkbot.space;
    ssl_certificate     /etc/letsencrypt/live/darkbot.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkbot.space/privkey.pem;
    client_max_body_size 10m; # screenshots of communities are uploaded up to 8 MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
