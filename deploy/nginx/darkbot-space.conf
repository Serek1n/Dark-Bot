# nginx for the panel at https://darkbot.space:8843 (port 443 is taken by the VPN).
# Install: cp /opt/Dark-Bot/deploy/nginx/darkbot-space.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# The certificate: certbot certonly --webroot -w /var/www/letsencrypt -d darkbot.space --deploy-hook "systemctl reload nginx"

# port 80: only the Let's Encrypt check (renewal is automatic), everything else goes to the panel
server {
    listen 80;
    listen [::]:80;
    server_name darkbot.space;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://darkbot.space:8843$request_uri; }
}

# port 8843: the panel itself (plain http typed on this port is sent to https)
server {
    listen 8843 ssl;
    server_name darkbot.space;
    ssl_certificate     /etc/letsencrypt/live/darkbot.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkbot.space/privkey.pem;
    error_page 497 https://darkbot.space:8843$request_uri;
    client_max_body_size 10m; # screenshots of communities are uploaded up to 8 MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
