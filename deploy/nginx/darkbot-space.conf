# nginx for the panel at https://darkbot.space (port 443).
# Install: cp /opt/Dark-Bot/deploy/nginx/darkbot-space.conf /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# The certificate: certbot certonly --webroot -w /var/www/letsencrypt -d darkbot.space --deploy-hook "systemctl reload nginx"

# ---- protection from a flood of requests (the files of conf.d are read inside http {}) ----
# per address: pages 10 a second (bursts up to 40 pass at once), sign-in 5 a minute, files 50 a second; 30 connections
limit_req_zone  $binary_remote_addr zone=dark_pages:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=dark_auth:10m  rate=5r/m;
limit_req_zone  $binary_remote_addr zone=dark_files:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=dark_conn:10m;
# all anonymous visitors together: at most 150 pages a second reach the panel (it runs in the bot's process — an attack
# from thousands of addresses gets nginx's cheap 429 instead of taking the bot down). Those signed in are not counted.
map $http_cookie $dark_anon { "~connect\.sid=s%3A" ""; default "anon"; }
limit_req_zone  $dark_anon zone=dark_total:1m rate=150r/s;

# port 80: the Let's Encrypt check (renewal is automatic), everything else goes to https
server {
    listen 80;
    listen [::]:80;
    server_name darkbot.space;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://darkbot.space$request_uri; }
}

# port 8843: the old address of the panel — links and bookmarks lead to the new one
server {
    listen 8843 ssl;
    server_name darkbot.space;
    ssl_certificate     /etc/letsencrypt/live/darkbot.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkbot.space/privkey.pem;
    return 301 https://darkbot.space$request_uri;
}

# port 443: the panel itself
server {
    listen 443 ssl http2;     # works on every nginx version (newer ones only warn)
    listen [::]:443 ssl http2;
    server_name darkbot.space;
    ssl_certificate     /etc/letsencrypt/live/darkbot.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkbot.space/privkey.pem;
    ssl_session_cache   shared:dark_ssl:10m; # a returning browser skips the costly part of the TLS handshake
    ssl_session_timeout 1h;

    client_max_body_size 25m; # an import of levels is up to 25 MB, a picture of the catalog up to 8 MB
    # slow clients (an attack that opens connections and sends nothing) are cut off quickly
    client_header_timeout 10s;
    client_body_timeout   20s;
    send_timeout          30s;
    keepalive_timeout     30s;
    reset_timedout_connection on;

    limit_conn dark_conn 30;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr; # only the real address: a forged X-Forwarded-For cannot dodge the limits
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # the panel's files (styles, scripts, fonts, pictures): many per page, cheap
    location ~ ^/(css|js|fonts|season|app-emoji|communities/media)/ {
        limit_req zone=dark_files burst=200 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    # signing in through Discord
    location /auth/ {
        limit_req zone=dark_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
    location / {
        limit_req zone=dark_pages burst=40 nodelay;
        limit_req zone=dark_total burst=300 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}
